[project]
name = "quantfolio"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "yfinance",
    "pyarrow",
    "matplotlib",
    "scikit-learn",
    "cvxpy",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["quantfolio*"]
